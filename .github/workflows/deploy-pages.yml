name: Deploy CME-3D Motion Lab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cme3d-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Restore pinned CC0 anatomy GLBs
        uses: actions/cache@v4
        with:
          path: public/anatomie/*.glb
          key: anatomy-${{ hashFiles('scripts/fetch-premium-anatomy.mjs') }}
      - name: Fetch and validate CC0 anatomy GLBs
        run: npm run fetch:anatomy
      - name: Build GitHub Pages PWA
        run: npm run build -- --mode pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
