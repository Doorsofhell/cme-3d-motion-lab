name: Studio Coach PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Restore pinned CC0 anatomy GLBs
        uses: actions/cache@v4
        with:
          path: public/anatomie/*.glb
          key: anatomy-${{ hashFiles('scripts/fetch-premium-anatomy.mjs') }}
      - name: Fetch and validate CC0 anatomy GLBs
        run: npm run fetch:anatomy
      - run: npm run build -- --mode pages
