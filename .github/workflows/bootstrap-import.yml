name: Import CME-3D standalone project
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-import.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout empty repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified standalone archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3AnRK2HScfmCMSrMLAtsAf1MESy/bca0729d-d981-4d2a-90ff-7aeb2bcba665.zip' \
            -o /tmp/cme-3d-motion-lab.zip
          printf '%s  %s\n' 'f29b697e91d1281c1a212c57e349be83f7c7ae45e1a76c214b3c86caa356f8c2' '/tmp/cme-3d-motion-lab.zip' | sha256sum --check
          unzip -q /tmp/cme-3d-motion-lab.zip -d /tmp/cme-3d-motion-lab-src
          test -f /tmp/cme-3d-motion-lab-src/package.json
          test -f /tmp/cme-3d-motion-lab-src/.github/workflows/deploy-pages.yml
          cp -a /tmp/cme-3d-motion-lab-src/. .

      - name: Remove one-time importer and publish source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import standalone CME-3D Motion Lab v0.3 and Pages workflow"
          git push origin HEAD:main
