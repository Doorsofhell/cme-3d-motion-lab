name: Import CME-3D biomechanical reference
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-biomecanique.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cme-biomecanique-initial-import
  cancel-in-progress: false

jobs:
  import-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve and verify research archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 120 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3AnRK2HScfmCMSrMLAtsAf1MESy/ee0c5235-9580-4302-a48c-a3ae05abd3fc.zip" \
            -o /tmp/cme-biomech.zip
          echo "2ce1722575509f4173f3ca14426735c1c1ca3ad81b021d7703e10eed9a186dd9  /tmp/cme-biomech.zip" | sha256sum -c -
          unzip -Z1 /tmp/cme-biomech.zip | grep -v '^docs/biomecanique/' | grep . && exit 1 || true
          unzip -q /tmp/cme-biomech.zip
          python3 docs/biomecanique/validate_biomecanique.py
      - name: Commit only documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/biomecanique
          if ! git diff --cached --quiet; then
            git commit -m "docs(CME-3D): establish six-discipline biomechanics reference and visual atlas"
            git push origin HEAD:main
          fi
