name: One-time CME-3D v0.7.0 release importer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-release-v070.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cme3d-v070-release-import
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify exact release
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 "https://d2ol7oe51mr4n9.cloudfront.net/user_3AnRK2HScfmCMSrMLAtsAf1MESy/7411e021-81f7-4770-a7dc-322c25bbde23.zip" -o /tmp/cme-release.zip
          echo "eabd24971475dd7bfdf8ffb1b3b05af3847cd932c9a7c5b4173eee775e74e691  /tmp/cme-release.zip" | sha256sum -c -
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          allowed=('docs/biomecanique/','src/lab/','src/adapters/','src/shadow-engine/library/','package.json','package-lock.json','public/cme-sw.js')
          with ZipFile('/tmp/cme-release.zip') as z:
              assert len(z.namelist())==22, 'Unapproved file count'
              for n in z.namelist():
                  assert not n.startswith('/') and '..' not in PurePosixPath(n).parts and n.startswith(allowed), n
              z.extractall('.')
          PY
      - name: Validate biotech reference and source
        run: |
          set -euo pipefail
          python3 docs/biomecanique/validate_biomecanique.py
          npm ci --no-audit --no-fund
          npm test
          npm run build -- --mode pages
      - name: Commit and publish passing release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from zipfile import ZipFile
          import subprocess
          with ZipFile('/tmp/cme-release.zip') as z:
              subprocess.run(['git','add','--',*z.namelist()],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "feat(CME-3D): v0.7.0 combat choreography, three-tab comparison, GitHub biomechanics atlas"
            git push origin HEAD:main
          fi
