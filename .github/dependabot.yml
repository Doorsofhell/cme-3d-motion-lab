version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      three-and-react:
        patterns: ['three', '@types/three', '@react-three/*', 'react', 'react-dom', '@types/react*']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
