<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#f0f3f8"/><title>CME-3D · Motion Lab</title><link rel="manifest" href="%BASE_URL%manifest.webmanifest"><link rel="icon" href="%BASE_URL%cme-icon-192.png"><link rel="stylesheet" href="/src/lab/mobileUsability.css"></head><body><div id="root"></div><script>
/* Escape a controlling legacy worker before loading any JS bundle. */
(function(){
 if(!('serviceWorker' in navigator)||!navigator.serviceWorker.controller)return;
 /* Versioned workers (cme-sw.js?v=...) are current: only legacy ones are removed. */
 if(navigator.serviceWorker.controller.scriptURL.indexOf('?v=')!==-1)return;
 var marker='cme3d-recovery-039';
 try{if(sessionStorage.getItem(marker)==='done')return;sessionStorage.setItem(marker,'done');}catch(e){}
 var base=new URL('%BASE_URL%',location.origin).pathname;
 Promise.all([
  navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.filter(function(r){return new URL(r.scope).pathname===base;}).map(function(r){return r.unregister();}));}),
  'caches' in window?caches.keys().then(function(keys){return Promise.all(keys.filter(function(k){return /cme3d|cme-3d|motion-lab/i.test(k);}).map(function(k){return caches.delete(k);}));}):Promise.resolve()
 ]).then(function(){var u=new URL(location.href);u.searchParams.set('cme-fresh','039');location.replace(u.href);}).catch(function(e){console.warn('CME recovery',e);});
})();
</script><script type="module" src="/src/lab/main.tsx"></script></body></html>
